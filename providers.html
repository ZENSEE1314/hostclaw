<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Providers - HostClaw.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #06b6d4;
            --accent: #f59e0b;
            --dark: #0f0f23;
            --darker: #0a0a1a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--darker);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Alert */
        .alert {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert-icon {
            font-size: 1.25rem;
        }

        .alert-content {
            flex: 1;
        }

        .alert-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .alert-text {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Provider Cards */
        .provider-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }

        .provider-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .provider-card.configured {
            border-color: var(--success);
        }

        .provider-card.default {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .provider-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .provider-logo {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .provider-info {
            flex: 1;
        }

        .provider-name {
            font-weight: 600;
            font-size: 1.125rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .provider-badge {
            font-size: 0.625rem;
            padding: 0.125rem 0.5rem;
            border-radius: 100px;
            background: var(--success);
            color: white;
        }

        .provider-badge.default {
            background: var(--primary);
        }

        .provider-desc {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .provider-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .status-dot.inactive {
            background: var(--text-muted);
        }

        .status-text {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Form */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.9375rem;
            font-family: inherit;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.375rem;
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
        }

        .input-group .form-input {
            flex: 1;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .provider-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        /* Models list */
        .models-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .model-tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.625rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            color: var(--text-muted);
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--success);
        }

        .toast.error {
            border-color: var(--danger);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            
            .provider-actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='/dashboard.html'">←</button>
                <div>
                    <h1>AI Providers</h1>
                    <p>Configure your AI API keys</p>
                </div>
            </div>
        </div>

        <div class="alert">
            <div class="alert-icon">🔒</div>
            <div class="alert-content">
                <div class="alert-title">Your API keys are secure</div>
                <div class="alert-text">Keys are encrypted and never shared. They're only used to make API calls on your behalf.</div>
            </div>
        </div>

        <div id="providersList">
            <div style="text-align: center; padding: 3rem;">
                <div class="loading"></div>
                <p style="margin-top: 1rem; color: var(--text-muted);">Loading providers...</p>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastIcon">✓</span>
        <span id="toastMessage">Success!</span>
    </div>

    <script>
        const API_URL = 'https://hostclaw-api.onrender.com';
        const token = localStorage.getItem('token');
        
        if (!token) {
            window.location.href = '/login.html';
        }

        const PROVIDERS = [
            {
                id: 'openai',
                name: 'OpenAI',
                icon: '🤖',
                description: 'GPT-4, GPT-4o, GPT-3.5 Turbo',
                models: ['gpt-4o', 'gpt-4-turbo', 'gpt-3.5-turbo'],
                keyPlaceholder: 'sk-...',
                keyPattern: /^sk-[a-zA-Z0-9]+$/
            },
            {
                id: 'anthropic',
                name: 'Anthropic',
                icon: '🧠',
                description: 'Claude 3.5 Sonnet, Claude 3 Opus',
                models: ['claude-3-5-sonnet', 'claude-3-opus', 'claude-3-haiku'],
                keyPlaceholder: 'sk-ant-...'
            },
            {
                id: 'kimi',
                name: 'Moonshot (Kimi)',
                icon: '🌙',
                description: 'Kimi K2.5, Kimi K2',
                models: ['kimi-k2.5', 'kimi-k2'],
                keyPlaceholder: 'Your Kimi API key'
            },
            {
                id: 'gemini',
                name: 'Google Gemini',
                icon: '✨',
                description: 'Gemini Pro, Gemini Ultra',
                models: ['gemini-pro', 'gemini-ultra'],
                keyPlaceholder: 'Your Gemini API key'
            },
            {
                id: 'deepseek',
                name: 'DeepSeek',
                icon: '🔮',
                description: 'DeepSeek Chat, DeepSeek Coder',
                models: ['deepseek-chat', 'deepseek-coder'],
                keyPlaceholder: 'Your DeepSeek API key'
            },
            {
                id: 'groq',
                name: 'Groq',
                icon: '⚡',
                description: 'Llama 3, Mixtral, Gemma',
                models: ['llama-3.1-70b', 'llama-3.1-8b', 'mixtral-8x7b'],
                keyPlaceholder: 'gsk_...'
            }
        ];

        let userProviders = {};
        let defaultProvider = 'openai';

        async function loadProviders() {
            try {
                const response = await fetch(`${API_URL}/api/providers`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    userProviders = data.providers || {};
                    defaultProvider = data.default_provider || 'openai';
                    renderProviders();
                }
            } catch (error) {
                console.error('Failed to load providers:', error);
                showToast('Failed to load providers', 'error');
            }
        }

        function renderProviders() {
            const container = document.getElementById('providersList');
            
            container.innerHTML = PROVIDERS.map(provider => {
                const config = userProviders[provider.id];
                const isConfigured = !!config?.apiKey;
                const isDefault = defaultProvider === provider.id;
                
                return `
                    <div class="provider-card ${isConfigured ? 'configured' : ''} ${isDefault ? 'default' : ''}" id="card-${provider.id}">
                        <div class="provider-header">
                            <div class="provider-logo">${provider.icon}</div>
                            <div class="provider-info">
                                <div class="provider-name">
                                    ${provider.name}
                                    ${isConfigured ? '<span class="provider-badge">✓ Connected</span>' : ''}
                                    ${isDefault ? '<span class="provider-badge default">Default</span>' : ''}
                                </div>
                                <div class="provider-desc">${provider.description}</div>
                            </div>
                            <div class="provider-status">
                                <div class="status-dot ${isConfigured ? '' : 'inactive'}"></div>
                                <span class="status-text">${isConfigured ? 'Active' : 'Not configured'}</span>
                            </div>
                        </div>

                        ${!isConfigured ? `
                            <div id="form-${provider.id}">
                                <div class="form-group">
                                    <label class="form-label">API Key</label>
                                    <div class="input-group">
                                        <input type="password" 
                                               class="form-input" 
                                               id="key-${provider.id}" 
                                               placeholder="${provider.keyPlaceholder}">
                                        <button class="btn btn-primary btn-sm" onclick="saveProvider('${provider.id}')">
                                            Save
                                        </button>
                                    </div>
                                    <div class="form-hint">
                                        Your API key is encrypted and stored securely. 
                                        <a href="#" style="color: var(--primary-light);">How to get API key →</a>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Default Model</label>
                                    <select class="form-select" id="model-${provider.id}">
                                        ${provider.models.map(m => `<option value="${m}">${m}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                        ` : `
                            <div id="configured-${provider.id}">
                                <div class="models-list">
                                    ${provider.models.map(m => `<span class="model-tag ${config.model === m ? 'style="background: var(--primary); color: white;"' : ''}">${m}</span>`).join('')}
                                </div>
                                <div class="provider-actions" style="margin-top: 1rem;">
                                    ${!isDefault ? `
                                        <button class="btn btn-outline btn-sm" onclick="setDefault('${provider.id}')">
                                            Set as Default
                                        </button>
                                    ` : ''}
                                    <button class="btn btn-outline btn-sm" onclick="testProvider('${provider.id}')">
                                        Test Connection
                                    </button>
                                    <button class="btn btn-danger btn-sm" onclick="removeProvider('${provider.id}')">
                                        Remove
                                    </button>
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        }

        async function saveProvider(providerId) {
            const keyInput = document.getElementById(`key-${providerId}`);
            const modelSelect = document.getElementById(`model-${providerId}`);
            const apiKey = keyInput.value.trim();
            
            if (!apiKey) {
                showToast('Please enter an API key', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/providers`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        provider: providerId,
                        apiKey,
                        model: modelSelect.value
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showToast(data.message);
                    await loadProviders();
                } else {
                    showToast(data.error || 'Failed to save API key', 'error');
                }
            } catch (error) {
                showToast('Network error', 'error');
            }
        }

        async function removeProvider(providerId) {
            if (!confirm('Remove this provider configuration?')) return;

            try {
                const response = await fetch(`${API_URL}/api/providers/${providerId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    showToast('Provider removed');
                    await loadProviders();
                } else {
                    showToast('Failed to remove provider', 'error');
                }
            } catch (error) {
                showToast('Network error', 'error');
            }
        }

        async function setDefault(providerId) {
            try {
                const response = await fetch(`${API_URL}/api/providers/default`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ provider: providerId })
                });

                if (response.ok) {
                    showToast('Default provider updated');
                    await loadProviders();
                } else {
                    showToast('Failed to update default', 'error');
                }
            } catch (error) {
                showToast('Network error', 'error');
            }
        }

        async function testProvider(providerId) {
            try {
                const response = await fetch(`${API_URL}/api/providers/${providerId}/test`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();

                if (response.ok) {
                    showToast(data.message);
                } else {
                    showToast(data.error || 'Connection test failed', 'error');
                }
            } catch (error) {
                showToast('Network error', 'error');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            document.getElementById('toastIcon').textContent = type === 'success' ? '✓' : '✗';
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        loadProviders();
    </script>
</body>
</html>
