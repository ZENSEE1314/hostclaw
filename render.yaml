services:
  # Web Service (API)
  - type: web
    name: hostclaw-api
    runtime: node
    region: singapore
    plan: standard
    buildCommand: cd api && npm install
    startCommand: cd api && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: hostclaw-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hostclaw-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        value: https://hostclaw.onrender.com

  # Static Site (Frontend)
  - type: web
    name: hostclaw-web
    runtime: static
    buildCommand: echo "No build needed"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /api/*
        destination: https://hostclaw-api.onrender.com/api/*
      - type: rewrite
        source: /admin
        destination: /admin.html
      - type: rewrite
        source: /dashboard
        destination: /dashboard.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        value: https://hostclaw-api.onrender.com

  # Background Worker
  - type: worker
    name: hostclaw-worker
    runtime: node
    region: singapore
    plan: starter
    buildCommand: cd api && npm install
    startCommand: cd api && node workers/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hostclaw-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hostclaw-redis
          property: connectionString
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        value: https://hostclaw.onrender.com

databases:
  - name: hostclaw-db
    databaseName: hostclaw
    user: hostclaw
    plan: starter
    region: singapore

redis:
  - name: hostclaw-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: noeviction