services:
  # Web Service (API)
  - type: web
    name: hostclaw-api
    runtime: node
    region: singapore
    plan: standard
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: hostclaw-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://hostclaw.onrender.com
      # Optional - add these manually after initial deploy
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SMTP_USER
        sync: false

  # Static Site (Frontend)
  - type: web
    name: hostclaw-web
    runtime: static
    buildCommand: echo "Build complete"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /api/*
        destination: https://hostclaw-api.onrender.com/api/*
      - type: rewrite
        source: /admin
        destination: /admin.html
      - type: rewrite
        source: /dashboard
        destination: /dashboard.html
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: hostclaw-db
    databaseName: hostclaw
    user: hostclaw
    plan: free
    region: singapore

# NOTE: Add these manually after initial deploy:
# 1. Create Redis: Render Dashboard → New + → Redis → name: hostclaw-redis
# 2. Create Worker: New + → Background Worker → name: hostclaw-worker → connect same repo
# 3. Update environment variables with actual Redis URL