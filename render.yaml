# Render Blueprint for HostClaw
# Deploy with: New + → Blueprint → Connect GitHub

services:
  # Web Service (API)
  - type: web
    name: hostclaw-api
    runtime: node
    region: singapore
    plan: starter
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: hostclaw-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://hostclaw-web.onrender.com

  # Web Service (Frontend) - using nginx to serve static files
  - type: web
    name: hostclaw-web
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile.web
    envVars:
      - key: API_URL
        value: https://hostclaw-api.onrender.com

databases:
  - name: hostclaw-db
    databaseName: hostclaw
    user: hostclaw
    plan: free
    region: singapore
