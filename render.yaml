services:
  # Static Site (Frontend)
  - type: static
    name: hostclaw-web
    runtime: static
    region: singapore
    plan: free
    buildCommand: echo "Static site - no build needed"
    staticPublishPath: ./
    envVars:
      - key: API_URL
        value: https://hostclaw-api.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://hostclaw-api.onrender.com/api/:splat
      - type: rewrite
        source: /webhooks/*
        destination: https://hostclaw-api.onrender.com/webhooks/:splat

  # Web Service (API)
  - type: web
    name: hostclaw-api
    runtime: node
    region: singapore
    plan: standard
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: hostclaw-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://hostclaw-web.onrender.com

databases:
  - name: hostclaw-db
    databaseName: hostclaw
    user: hostclaw
    plan: free
    region: singapore