apiVersion: v1
kind: Namespace
metadata:
  name: hostclaw
  labels:
    name: hostclaw
---
apiVersion: v1
kind: Namespace
metadata:
  name: hostclaw-agents
  labels:
    name: hostclaw-agents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostclaw-api
  namespace: hostclaw
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hostclaw-api
  template:
    metadata:
      labels:
        app: hostclaw-api
    spec:
      containers:
      - name: api
        image: hostclaw/api:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: hostclaw-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: hostclaw-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: hostclaw-secrets
              key: jwt-secret
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: hostclaw-secrets
              key: stripe-secret-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hostclaw-api-svc
  namespace: hostclaw
spec:
  selector:
    app: hostclaw-api
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hostclaw-api-ingress
  namespace: hostclaw
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - api.hostclaw.ai
    secretName: hostclaw-api-tls
  rules:
  - host: api.hostclaw.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hostclaw-api-svc
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hostclaw-api-hpa
  namespace: hostclaw
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hostclaw-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80