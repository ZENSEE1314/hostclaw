<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Users</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f23; color: #fff; padding: 20px; }
        h1 { margin-bottom: 20px; font-size: 24px; }
        .container { max-width: 1400px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; background: #1a1a2e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #2d2d3d; }
        th { background: #252540; font-size: 12px; text-transform: uppercase; color: #94a3b8; font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.03); }
        .badge { padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 500; }
        .badge-starter { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .badge-pro { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .badge-enterprise { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
        .btn { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .status-yes { color: #10b981; }
        .status-no { color: #64748b; }
        .debug { margin-top: 20px; padding: 15px; background: #1a1a2e; border-radius: 8px; font-family: monospace; font-size: 12px; color: #94a3b8; white-space: pre-wrap; }
        .error { color: #ef4444; }
        .success { color: #10b981; }
        .loading { color: #f59e0b; }
        
        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #1a1a2e;
            border: 1px solid #2d2d3d;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
        }
        .modal h2 { margin-bottom: 20px; font-size: 18px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: #252540;
            border: 1px solid #3d3d4d;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: #6366f1;
        }
        .form-select {
            width: 100%;
            padding: 10px 12px;
            background: #252540;
            border: 1px solid #3d3d4d;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #6366f1;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #3d3d4d;
            color: #94a3b8;
        }
        .btn-secondary:hover {
            border-color: #6366f1;
            color: #fff;
        }
        .btn-success {
            background: #10b981;
        }
        .btn-success:hover {
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👥 Users</h1>
        
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Plan</th>
                    <th>Credits</th>
                    <th>Paid</th>
                    <th>Created</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="usersTable">
                <tr><td colspan="7" style="text-align:center; padding:40px;">Loading users...</td></tr>
            </tbody>
        </table>
        
        <div class="debug" id="debug">Loading...</div>
        
        <!-- Edit User Modal -->
        <div class="modal-overlay" id="editModal">
            <div class="modal">
                <h2>✏️ Edit User</h2>
                <input type="hidden" id="editUserId">
                
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="editName" class="form-input">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="editEmail" class="form-input" readonly style="background: #1a1a2e; cursor: not-allowed;">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Plan</label>
                    <select id="editPlan" class="form-select">
                        <option value="starter">Starter</option>
                        <option value="pro">Pro</option>
                        <option value="enterprise">Enterprise</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Credits ($)</label>
                    <input type="number" id="editCredits" class="form-input" step="0.01">
                </div>
                
                <div class="form-group">
                    <label class="form-label"></div>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="editHasPaid">
                        <span>Mark as Paid</span>
                    </div>
                </div>
                
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-success" onclick="saveUser()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

        <script>
        const API_URL = 'https://hostclaw-production-8e47.up.railway.app';
        let allUsers = [];
        
        async function loadUsers() {
            const tbody = document.getElementById('usersTable');
            const debug = document.getElementById('debug');
            
            const token = localStorage.getItem('adminToken') || localStorage.getItem('token');
            if (!token) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:40px; color:#ef4444;">Not logged in</td></tr>';
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/admin/users`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (!response.ok) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:40px; color:#ef4444;">Error: ${response.status}</td></tr>`;
                    return;
                }
                
                const data = await response.json();
                allUsers = data.users || [];
                
                let html = '';
                for (const user of allUsers) {
                    const planClass = 'badge-' + (user.plan || 'starter');
                    html += `<tr>
                        <td>${user.name || 'N/A'}</td>
                        <td>${user.email || 'N/A'}</td>
                        <td><span class="badge ${planClass}">${user.plan || 'starter'}</span></td>
                        <td>$${user.credits || 0}</td>
                        <td class="${user.has_paid ? 'status-yes' : 'status-no'}">${user.has_paid ? '✓ Yes' : '✗ No'}</td>
                        <td>${user.created_at ? user.created_at.split('T')[0] : 'N/A'}</td>
                        <td><button class="btn btn-primary" onclick="openEditModal('${user.id}')">Edit</button></td>
                    </tr>`;
                }
                tbody.innerHTML = html;
                debug.innerHTML = '<span class="success">Loaded ' + allUsers.length + ' users</span>';
                
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:40px; color:#ef4444;">${err.message}</td></tr>`;
            }
        }
        
        function openEditModal(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;
            
            document.getElementById('editUserId').value = user.id;
            document.getElementById('editName').value = user.name || '';
            document.getElementById('editEmail').value = user.email || '';
            document.getElementById('editPlan').value = user.plan || 'starter';
            document.getElementById('editCredits').value = user.credits || 0;
            document.getElementById('editHasPaid').checked = user.has_paid === 1 || user.has_paid === true;
            
            document.getElementById('editModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }
        
        async function saveUser() {
            const userId = document.getElementById('editUserId').value;
            const token = localStorage.getItem('adminToken') || localStorage.getItem('token');
            
            const updates = {
                name: document.getElementById('editName').value,
                plan: document.getElementById('editPlan').value,
                credits: parseFloat(document.getElementById('editCredits').value),
                has_paid: document.getElementById('editHasPaid').checked
            };
            
            try {
                const response = await fetch(`${API_URL}/api/admin/users/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updates)
                });
                
                if (response.ok) {
                    closeModal();
                    loadUsers();
                    alert('User updated!');
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to update');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
        
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') closeModal();
        });
        
        loadUsers();
    </script>
</body>
</html>
