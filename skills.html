<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills - HostClaw.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #06b6d4;
            --accent: #f59e0b;
            --dark: #0f0f23;
            --darker: #0a0a1a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--darker);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .tab {
            padding: 0.75rem 1.25rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Skills Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .skill-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.2s;
        }

        .skill-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .skill-card.installed {
            border-color: var(--success);
        }

        .skill-header {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .skill-icon {
            width: 48px;
            height: 48px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .skill-info {
            flex: 1;
        }

        .skill-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .skill-desc {
            font-size: 0.875rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .skill-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.625rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .skill-status {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
            margin-top: 0.75rem;
        }

        .skill-status.active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .skill-status.inactive {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-muted);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .empty-desc {
            color: var(--text-muted);
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Terminal */
        .terminal-section {
            margin-top: 2.5rem;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        .terminal-header {
            background: #1e1e2e;
            padding: 0.625rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .terminal-dots { display: flex; gap: 0.375rem; }
        .terminal-dots span {
            width: 12px; height: 12px; border-radius: 50%;
        }
        .terminal-dots span:nth-child(1) { background: #ff5f57; }
        .terminal-dots span:nth-child(2) { background: #febc2e; }
        .terminal-dots span:nth-child(3) { background: #28c840; }

        .terminal-title {
            flex: 1;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            margin-left: -3rem;
        }

        .term-clear-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
            padding: 0.125rem 0.375rem;
        }
        .term-clear-btn:hover { color: rgba(255,255,255,0.6); }

        .terminal-output {
            background: #0d1117;
            padding: 1rem;
            min-height: 160px;
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .term-line {
            font-size: 0.8125rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .term-line.term-input-echo { color: #c9d1d9; }
        .term-line.term-success    { color: #3fb950; }
        .term-line.term-error      { color: #f85149; }
        .term-line.term-info       { color: #58a6ff; }
        .term-line.term-muted      { color: rgba(255,255,255,0.35); }
        .term-line.term-warn       { color: #e3b341; }

        .term-cmd { color: #79c0ff; font-weight: 600; }

        .terminal-input-row {
            background: #0d1117;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 0.625rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .term-prompt { color: #3fb950; font-size: 0.8125rem; flex-shrink: 0; }

        .term-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #c9d1d9;
            font-size: 0.8125rem;
            font-family: inherit;
            outline: none;
            caret-color: #3fb950;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--success);
        }

        .toast.error {
            border-color: var(--danger);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <button class="back-btn" onclick="history.back()">←</button>
                <div>
                    <h1>Skills</h1>
                    <p>Add capabilities to your AI assistant</p>
                </div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('catalog')">📦 Skill Catalog</button>
            <button class="tab" onclick="switchTab('installed')">✅ My Skills</button>
        </div>

        <div id="catalogView" class="skills-grid">
            <div class="empty-state">
                <div class="loading"></div>
                <p style="margin-top: 1rem; color: var(--text-muted);">Loading skills...</p>
            </div>
        </div>

        <div id="installedView" class="skills-grid" style="display: none;">
            <div class="empty-state">
                <div class="loading"></div>
                <p style="margin-top: 1rem; color: var(--text-muted);">Loading your skills...</p>
            </div>
        </div>
    </div>

    <!-- Skill Terminal -->
    <div class="container" style="padding-top:0">
        <div class="terminal-section">
            <div class="terminal-header">
                <div class="terminal-dots"><span></span><span></span><span></span></div>
                <div class="terminal-title">Skill Terminal</div>
                <button class="term-clear-btn" onclick="termClear()">clear</button>
            </div>
            <div class="terminal-output" id="termOutput">
                <div class="term-line term-info">HostClaw Skill Manager — type <span class="term-cmd">help</span> to see commands</div>
            </div>
            <div class="terminal-input-row">
                <span class="term-prompt">$&nbsp;</span>
                <input type="text" class="term-input" id="termInput"
                       placeholder="install web_search"
                       autocomplete="off" spellcheck="false"
                       onkeydown="termHandleKey(event)">
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastIcon">✓</span>
        <span id="toastMessage">Success!</span>
    </div>

    <script>
        const API_URL = 'https://hostclaw-production-8e47.up.railway.app';
        const token = localStorage.getItem('token');
        
        if (!token) {
            window.location.href = '/login.html';
        }

        let allSkills = [];
        let mySkills = [];

        async function loadSkills() {
            try {
                // Load catalog
                const catalogRes = await fetch(`${API_URL}/api/skills/catalog`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (catalogRes.ok) {
                    const data = await catalogRes.json();
                    allSkills = data.skills || [];
                }

                // Load my skills
                const myRes = await fetch(`${API_URL}/api/skills/my`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (myRes.ok) {
                    const data = await myRes.json();
                    mySkills = data.skills || [];
                }

                renderCatalog();
                renderInstalled();
            } catch (error) {
                console.error('Failed to load skills:', error);
                showToast('Failed to load skills', 'error');
            }
        }

        function renderCatalog() {
            const container = document.getElementById('catalogView');
            const installedIds = mySkills.map(s => s.id);
            
            const availableSkills = allSkills.filter(s => !installedIds.includes(s.id));
            
            if (availableSkills.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">🎉</div>
                        <div class="empty-title">All skills installed!</div>
                        <div class="empty-desc">You've installed all available skills. Check "My Skills" to manage them.</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = availableSkills.map(skill => `
                <div class="skill-card">
                    <div class="skill-header">
                        <div class="skill-icon">${skill.icon}</div>
                        <div class="skill-info">
                            <div class="skill-name">${skill.name}</div>
                            <div class="skill-desc">${skill.description}</div>
                        </div>
                    </div>
                    <div class="skill-actions">
                        <button class="btn btn-primary" onclick="installSkill('${skill.id}')">
                            + Install
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderInstalled() {
            const container = document.getElementById('installedView');
            
            if (mySkills.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">🧩</div>
                        <div class="empty-title">No skills installed</div>
                        <div class="empty-desc">Go to the Skill Catalog to add capabilities to your AI assistant.</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = mySkills.map(skill => `
                <div class="skill-card installed">
                    <div class="skill-header">
                        <div class="skill-icon">${skill.icon}</div>
                        <div class="skill-info">
                            <div class="skill-name">${skill.name}</div>
                            <div class="skill-desc">${skill.description}</div>
                        </div>
                    </div>
                    <span class="skill-status ${skill.active !== false ? 'active' : 'inactive'}">
                        ${skill.active !== false ? '● Active' : '○ Inactive'}
                    </span>
                    <div class="skill-actions">
                        <button class="btn btn-outline" onclick="toggleSkill('${skill.id}')">
                            ${skill.active !== false ? 'Disable' : 'Enable'}
                        </button>
                        <button class="btn btn-danger" onclick="uninstallSkill('${skill.id}')">
                            Remove
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function installSkill(skillId) {
            try {
                const response = await fetch(`${API_URL}/api/skills/install`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ skillId })
                });

                const data = await response.json();

                if (response.ok) {
                    showToast(`${data.skill.name} installed!`);
                    await loadSkills();
                } else {
                    showToast(data.error || 'Failed to install skill', 'error');
                }
            } catch (error) {
                showToast('Network error', 'error');
            }
        }

        async function uninstallSkill(skillId) {
            if (!confirm('Remove this skill?')) return;

            try {
                const response = await fetch(`${API_URL}/api/skills/${skillId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    showToast('Skill removed');
                    await loadSkills();
                } else {
                    showToast('Failed to remove skill', 'error');
                }
            } catch (error) {
                showToast('Network error', 'error');
            }
        }

        async function toggleSkill(skillId) {
            try {
                const response = await fetch(`${API_URL}/api/skills/${skillId}/toggle`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    showToast('Skill status updated');
                    await loadSkills();
                } else {
                    showToast('Failed to update skill', 'error');
                }
            } catch (error) {
                showToast('Network error', 'error');
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('catalogView').style.display = tab === 'catalog' ? 'grid' : 'none';
            document.getElementById('installedView').style.display = tab === 'installed' ? 'grid' : 'none';
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            document.getElementById('toastIcon').textContent = type === 'success' ? '✓' : '✗';
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        loadSkills();

        // ── Terminal ──────────────────────────────────────────────
        const SKILL_IDS = ['web_search','image_gen','code_executor','file_reader','calculator','translator','weather','news','reminders','email'];

        let termHistory = [];
        let termHistIdx = -1;

        function termPrint(text, cls = 'term-muted') {
            const out = document.getElementById('termOutput');
            const div = document.createElement('div');
            div.className = 'term-line ' + cls;
            div.textContent = text;
            out.appendChild(div);
            out.scrollTop = out.scrollHeight;
        }

        function termPrintHtml(html, cls = 'term-muted') {
            const out = document.getElementById('termOutput');
            const div = document.createElement('div');
            div.className = 'term-line ' + cls;
            div.innerHTML = html;
            out.appendChild(div);
            out.scrollTop = out.scrollHeight;
        }

        function termClear() {
            document.getElementById('termOutput').innerHTML =
                '<div class="term-line term-info">HostClaw Skill Manager — type <span class="term-cmd">help</span> to see commands</div>';
        }

        async function termRun(raw) {
            const cmd = raw.trim();
            if (!cmd) return;

            termHistory.unshift(cmd);
            termHistIdx = -1;

            termPrint('$ ' + cmd, 'term-input-echo');

            const parts = cmd.split(/\s+/);
            const action = parts[0].toLowerCase();
            const arg = parts.slice(1).join(' ').toLowerCase();

            if (action === 'help') {
                termPrint('Available commands:', 'term-info');
                termPrint('  install <skill_id>       Install a skill', 'term-muted');
                termPrint('  uninstall <skill_id>     Remove an installed skill', 'term-muted');
                termPrint('  list                     List your installed skills', 'term-muted');
                termPrint('  catalog                  List all available skills', 'term-muted');
                termPrint('  clear                    Clear terminal output', 'term-muted');
                termPrint('Available skill IDs:', 'term-info');
                termPrint('  ' + SKILL_IDS.join(', '), 'term-muted');

            } else if (action === 'catalog') {
                termPrint('Available skills:', 'term-info');
                allSkills.forEach(s => termPrint(`  ${s.icon} ${s.id.padEnd(18)} ${s.name} — ${s.description}`, 'term-muted'));

            } else if (action === 'list') {
                if (mySkills.length === 0) {
                    termPrint('No skills installed. Use: install <skill_id>', 'term-warn');
                } else {
                    termPrint('Installed skills:', 'term-info');
                    mySkills.forEach(s => termPrint(`  ${s.icon || '🧩'} ${s.id}  [${s.active !== false ? 'active' : 'inactive'}]`, 'term-success'));
                }

            } else if (action === 'install') {
                if (!arg) { termPrint('Usage: install <skill_id>', 'term-error'); return; }
                if (!SKILL_IDS.includes(arg)) {
                    termPrint(`Unknown skill: "${arg}". Run catalog to see available skills.`, 'term-error');
                    return;
                }
                if (mySkills.find(s => s.id === arg)) {
                    termPrint(`"${arg}" is already installed.`, 'term-warn');
                    return;
                }
                termPrint(`Installing ${arg}...`, 'term-info');
                try {
                    const res = await fetch(`${API_URL}/api/skills/install`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ skillId: arg })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        termPrint(`✓ Installed: ${data.skill?.name || arg}`, 'term-success');
                        await loadSkills();
                    } else {
                        termPrint('Error: ' + (data.error || 'Failed to install'), 'term-error');
                    }
                } catch (e) {
                    termPrint('Network error: ' + e.message, 'term-error');
                }

            } else if (action === 'uninstall' || action === 'remove') {
                if (!arg) { termPrint('Usage: uninstall <skill_id>', 'term-error'); return; }
                if (!mySkills.find(s => s.id === arg)) {
                    termPrint(`"${arg}" is not installed.`, 'term-warn');
                    return;
                }
                termPrint(`Removing ${arg}...`, 'term-info');
                try {
                    const res = await fetch(`${API_URL}/api/skills/${arg}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        termPrint(`✓ Removed: ${arg}`, 'term-success');
                        await loadSkills();
                    } else {
                        const data = await res.json();
                        termPrint('Error: ' + (data.error || 'Failed'), 'term-error');
                    }
                } catch (e) {
                    termPrint('Network error: ' + e.message, 'term-error');
                }

            } else if (action === 'clear') {
                termClear();
            } else {
                termPrint(`Unknown command: "${action}". Type help for commands.`, 'term-error');
            }
        }

        function termHandleKey(e) {
            const input = document.getElementById('termInput');
            if (e.key === 'Enter') {
                const val = input.value;
                input.value = '';
                termRun(val);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (termHistIdx < termHistory.length - 1) {
                    termHistIdx++;
                    input.value = termHistory[termHistIdx];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (termHistIdx > 0) {
                    termHistIdx--;
                    input.value = termHistory[termHistIdx];
                } else {
                    termHistIdx = -1;
                    input.value = '';
                }
            }
        }
    </script>
</body>
</html>
