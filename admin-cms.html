<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Settings - Admin - HostClaw.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/shared.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
    <div class="main-content">
        <div class="page-header">
            <div>
                <h1>Site Settings</h1>
                <p class="page-header-sub">Edit homepage content, SEO meta tags, and branding</p>
            </div>
            <button class="btn btn-primary" onclick="saveAll()">Save All Changes</button>
        </div>

        <div id="adminError" class="card mb-3" style="display:none;border-color:var(--danger);padding:1rem">
            <p style="color:var(--danger)">Admin access required. Only the first user or admin emails can edit site settings.</p>
        </div>

        <!-- SEO & Meta -->
        <div class="card mb-3">
            <div class="card-header"><h3 style="font-size:1.1rem;font-weight:600">SEO & Meta Tags</h3></div>
            <div class="form-group">
                <label class="form-label">Page Title (browser tab)</label>
                <input type="text" id="metaTitle" class="form-input" placeholder="HostClaw.ai — AI Chatbots for WhatsApp & Telegram">
            </div>
            <div class="form-group">
                <label class="form-label">Meta Description (Google search result)</label>
                <textarea id="metaDescription" class="form-textarea" rows="3" placeholder="Deploy AI chatbots..."></textarea>
                <p class="form-hint">Ideal: 150-160 characters</p>
            </div>
            <div class="form-group">
                <label class="form-label">Meta Keywords (comma-separated)</label>
                <input type="text" id="metaKeywords" class="form-input" placeholder="AI chatbot, WhatsApp bot, Telegram bot">
            </div>
            <div class="form-group">
                <label class="form-label">OG Image URL</label>
                <input type="text" id="ogImage" class="form-input" placeholder="https://...">
            </div>
        </div>

        <!-- Branding -->
        <div class="card mb-3">
            <div class="card-header"><h3 style="font-size:1.1rem;font-weight:600">Branding</h3></div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Site Name</label>
                    <input type="text" id="siteName" class="form-input" placeholder="HostClaw.ai">
                </div>
                <div class="form-group">
                    <label class="form-label">Tagline</label>
                    <input type="text" id="siteTagline" class="form-input" placeholder="AI Chatbots for WhatsApp & Telegram">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Site Description</label>
                <textarea id="siteDescription" class="form-textarea" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Contact Email</label>
                <input type="text" id="contactEmail" class="form-input" placeholder="support@hostclaw.ai">
            </div>
        </div>

        <!-- Hero -->
        <div class="card mb-3">
            <div class="card-header"><h3 style="font-size:1.1rem;font-weight:600">Hero Section</h3></div>
            <div class="form-group">
                <label class="form-label">Headline</label>
                <input type="text" id="heroTitle" class="form-input" placeholder="AI That Sells, Supports & Never Sleeps">
            </div>
            <div class="form-group">
                <label class="form-label">Subtitle</label>
                <textarea id="heroSubtitle" class="form-textarea" rows="3"></textarea>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">CTA Button Text</label>
                    <input type="text" id="heroCtaText" class="form-input" placeholder="Start Free">
                </div>
                <div class="form-group">
                    <label class="form-label">CTA Button Link</label>
                    <input type="text" id="heroCtaLink" class="form-input" placeholder="/signup.html">
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="card mb-3">
            <div class="card-header"><h3 style="font-size:1.1rem;font-weight:600">Footer</h3></div>
            <div class="form-group">
                <label class="form-label">Footer Text</label>
                <input type="text" id="footerText" class="form-input" placeholder="HostClaw.ai — AI-powered chatbots for business.">
            </div>
        </div>

        <button class="btn btn-primary btn-lg" onclick="saveAll()" style="width:100%">Save All Changes</button>
    </div>
</div>

<script src="/js/shared.js"></script>
<script src="/js/sidebar.js"></script>
<script>
    requireAuth();

    const FIELDS = {
        metaTitle: 'meta_title',
        metaDescription: 'meta_description',
        metaKeywords: 'meta_keywords',
        ogImage: 'og_image',
        siteName: 'site_name',
        siteTagline: 'site_tagline',
        siteDescription: 'site_description',
        contactEmail: 'contact_email',
        heroTitle: 'hero_title',
        heroSubtitle: 'hero_subtitle',
        heroCtaText: 'hero_cta_text',
        heroCtaLink: 'hero_cta_link',
        footerText: 'footer_text'
    };

    let settings = {};

    (async function load() {
        try {
            settings = await api('/api/site-settings');
            for (const [elId, key] of Object.entries(FIELDS)) {
                const el = document.getElementById(elId);
                if (el && settings[key]) el.value = settings[key];
            }
        } catch (e) {
            showToast('Failed to load settings', 'error');
        }
    })();

    async function saveAll() {
        const updated = { ...settings };
        for (const [elId, key] of Object.entries(FIELDS)) {
            const el = document.getElementById(elId);
            if (el) updated[key] = el.value;
        }
        try {
            await api('/api/site-settings', {
                method: 'PUT',
                body: JSON.stringify(updated)
            });
            showToast('Site settings saved', 'success');
        } catch (e) {
            if (e.message.includes('Admin')) {
                document.getElementById('adminError').style.display = 'block';
            }
            showToast(e.message, 'error');
        }
    }
</script>
</body>
</html>
