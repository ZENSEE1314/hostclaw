<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - HostClaw</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: #12121f;
            border-right: 1px solid #2d2d3d;
            padding: 20px;
            overflow-y: auto;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #2d2d3d;
        }
        .logo span { font-size: 24px; }
        .nav-section { margin-bottom: 24px; }
        .nav-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 8px;
            padding-left: 12px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(99, 102, 241, 0.1);
            color: #fff;
        }
        .nav-item.active {
            background: rgba(99, 102, 241, 0.2);
        }
        
        /* Main Content */
        .main {
            margin-left: 260px;
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 28px; }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #6366f1;
            color: white;
        }
        .btn-primary:hover { background: #4f46e5; }
        .btn-secondary {
            background: transparent;
            border: 1px solid #3d3d4d;
            color: #94a3b8;
        }
        .btn-secondary:hover {
            border-color: #6366f1;
            color: #fff;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-success:hover { background: #059669; }
        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #12121f;
            border: 1px solid #2d2d3d;
            border-radius: 12px;
            padding: 20px;
        }
        .stat-label {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
        }
        .stat-change {
            font-size: 12px;
            margin-top: 4px;
        }
        .stat-positive { color: #10b981; }
        .stat-negative { color: #ef4444; }
        
        /* Card */
        .card {
            background: #12121f;
            border: 1px solid #2d2d3d;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #2d2d3d;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
        }
        .card-body {
            padding: 20px;
        }
        
        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            font-size: 12px;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 600;
            border-bottom: 1px solid #2d2d3d;
        }
        td {
            padding: 16px;
            border-bottom: 1px solid #2d2d3d;
            font-size: 14px;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        /* Badges */
        .badge {
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-starter { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .badge-pro { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .badge-enterprise { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
        .badge-running { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .badge-stopped { background: rgba(100, 116, 139, 0.15); color: #64748b; }
        
        /* User cell */
        .user-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        
        /* Revenue */
        .revenue-display {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #12121f;
            border: 1px solid #2d2d3d;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            padding: 24px 24px 0;
        }
        .modal-header h2 {
            font-size: 20px;
            margin: 0;
        }
        .modal-body {
            padding: 24px;
        }
        .modal-footer {
            padding: 0 24px 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        /* Form */
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #94a3b8;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            background: #1e1e2e;
            border: 1px solid #2d2d3d;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #6366f1;
        }
        .form-input[readonly] {
            background: #0a0a1a;
            cursor: not-allowed;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #6366f1;
            cursor: pointer;
        }
        
        /* Sections */
        .section { display: none; }
        .section.active { display: block; }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }
        .error {
            text-align: center;
            padding: 60px;
            color: #ef4444;
        }
        
        /* Responsive */
        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <span>🐾</span>
            <div>HostClaw</div>
        </div>
        
        <div class="nav-section">
            <div class="nav-title">Overview</div>
            <div class="nav-item active" onclick="showSection('dashboard')">
                <span>📊</span> Dashboard
            </div>
            <div class="nav-item" onclick="showSection('sales')">
                <span>💰</span> Sales
            </div>
        </div>
        
        <div class="nav-section">
            <div class="nav-title">Management</div>
            <div class="nav-item" onclick="showSection('users')">
                <span>👥</span> Users
            </div>
            <div class="nav-item" onclick="showSection('agents')">
                <span>🤖</span> Agents
            </div>
        </div>
        
        <div class="nav-section">
            <div class="nav-item" onclick="logout()">
                <span>🚪</span> Logout
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <!-- Dashboard Section -->
        <div id="dashboardSection" class="section active">
            <div class="header">
                <h1>Dashboard</h1>
                <button class="btn btn-primary" onclick="loadDashboard()">Refresh</button>
            </div>
            
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="loading">Loading...</div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Recent Users</div>
                </div>
                <div class="card-body">
                    <div id="recentUsers">Loading...</div>
                </div>
            </div>
        </div>
        
        <!-- Sales Section -->
        <div id="salesSection" class="section">
            <div class="header">
                <h1>Sales & Revenue</h1>
                <button class="btn btn-primary" onclick="loadSales()">Refresh</button>
            </div>
            
            <div class="card">
                <div class="card-body" style="text-align: center; padding: 40px;">
                    <div style="margin-bottom: 10px; color: #94a3b8;">Total Revenue</div>
                    <div class="revenue-display" id="totalRevenue">$0.00</div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Paid Users</div>
                </div>
                <div class="card-body" id="paidUsersList">
                    Loading...
                </div>
            </div>
        </div>
        
        <!-- Users Section -->
        <div id="usersSection" class="section">
            <div class="header">
                <h1>Users</h1>
                <button class="btn btn-primary" onclick="loadUsers()">Refresh</button>
            </div>
            
            <div id="usersContainer">
                <div class="loading">Loading users...</div>
            </div>
        </div>
        
        <!-- Agents Section -->
        <div id="agentsSection" class="section">
            <div class="header">
                <h1>Agents</h1>
                <button class="btn btn-primary" onclick="loadAgents()">Refresh</button>
            </div>
            
            <div id="agentsContainer">
                <div class="loading">Loading agents...</div>
            </div>
        </div>
    </div>
    
    <!-- Edit User Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Edit User</h2>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editUserId">
                
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="editName" class="form-input">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="text" id="editEmail" class="form-input" readonly>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Plan</label>
                    <select id="editPlan" class="form-select">
                        <option value="starter">Starter</option>
                        <option value="pro">Pro</option>
                        <option value="enterprise">Enterprise</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Credits ($)</label>
                    <input type="number" id="editCredits" class="form-input" step="0.01">
                </div>
                
                <div class="form-group">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="editHasPaid">
                        <label for="editHasPaid">Mark as Paid</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-success" onclick="saveUser()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://hostclaw-api.onrender.com';
        const token = localStorage.getItem('adminToken') || localStorage.getItem('token');
        let allUsers = [];
        let allAgents = [];
        
        if (!token) {
            window.location.href = '/login.html';
        }
        
        // Navigation
        function showSection(sectionName) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(sectionName + 'Section').classList.add('active');
            event.target.classList.add('active');
            
            // Load data for section
            if (sectionName === 'dashboard') loadDashboard();
            if (sectionName === 'sales') loadSales();
            if (sectionName === 'users') loadUsers();
            if (sectionName === 'agents') loadAgents();
        }
        
        // Load Dashboard Stats
        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}/api/admin/stats`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (!response.ok) throw new Error('Failed to load stats');
                
                const data = await response.json();
                
                // Update stats grid
                const statsHtml = `
                    <div class="stat-card">
                        <div class="stat-label">Total Users</div>
                        <div class="stat-value">${data.users?.total_users || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Agents</div>
                        <div class="stat-value">${data.agents?.total_agents || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Paid Users</div>
                        <div class="stat-value">${data.users?.paid_users || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Revenue</div>
                        <div class="stat-value">$${(data.revenue?.total_revenue || 0).toFixed(2)}</div>
                    </div>
                `;
                document.getElementById('statsGrid').innerHTML = statsHtml;
                
                // Update recent users
                if (data.recent?.users) {
                    let recentHtml = '<table><thead><tr><th>User</th><th>Plan</th><th>Joined</th></tr></thead><tbody>';
                    for (const user of data.recent.users.slice(0, 5)) {
                        const planClass = 'badge-' + (user.plan || 'starter');
                        recentHtml += `
                            <tr>
                                <td>${user.name || 'Unknown'}</td>
                                <td><span class="badge ${planClass}">${user.plan || 'starter'}</span></td>
                                <td>${user.created_at ? user.created_at.split('T')[0] : 'N/A'}</td>
                            </tr>
                        `;
                    }
                    recentHtml += '</tbody></table>';
                    document.getElementById('recentUsers').innerHTML = recentHtml;
                }
            } catch (err) {
                document.getElementById('statsGrid').innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }
        
        // Load Sales
        async function loadSales() {
            try {
                const response = await fetch(`${API_URL}/api/admin/stats`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (!response.ok) throw new Error('Failed to load sales');
                
                const data = await response.json();
                
                document.getElementById('totalRevenue').textContent = '$' + (data.revenue?.total_revenue || 0).toFixed(2);
                
                // Load paid users
                const usersResponse = await fetch(`${API_URL}/api/admin/users`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (usersResponse.ok) {
                    const usersData = await usersResponse.json();
                    const paidUsers = (usersData.users || []).filter(u => u.has_paid);
                    
                    if (paidUsers.length === 0) {
                        document.getElementById('paidUsersList').innerHTML = '<div class="loading">No paid users yet</div>';
                    } else {
                        let html = '<table><thead><tr><th>User</th><th>Email</th><th>Plan</th><th>Joined</th></tr></thead><tbody>';
                        for (const user of paidUsers) {
                            const planClass = 'badge-' + (user.plan || 'starter');
                            html += `
                                <tr>
                                    <td>${user.name || 'Unknown'}</td>
                                    <td>${user.email || 'N/A'}</td>
                                    <td><span class="badge ${planClass}">${user.plan || 'starter'}</span></td>
                                    <td>${user.created_at ? user.created_at.split('T')[0] : 'N/A'}</td>
                                </tr>
                            `;
                        }
                        html += '</tbody></table>';
                        document.getElementById('paidUsersList').innerHTML = html;
                    }
                }
            } catch (err) {
                document.getElementById('totalRevenue').textContent = 'Error';
            }
        }
        
        // Load Users
        async function loadUsers() {
            const container = document.getElementById('usersContainer');
            container.innerHTML = '<div class="loading">Loading users...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/admin/users`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (!response.ok) throw new Error('Failed to load users');
                
                const data = await response.json();
                allUsers = data.users || [];
                
                if (allUsers.length === 0) {
                    container.innerHTML = '<div class="loading">No users found</div>';
                    return;
                }
                
                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Email</th>
                                <th>Plan</th>
                                <th>Credits</th>
                                <th>Paid</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                for (const user of allUsers) {
                    const planClass = 'badge-' + (user.plan || 'starter');
                    html += `
                        <tr>
                            <td>
                                <div class="user-cell">
                                    <div class="user-avatar">${(user.name || '?').charAt(0).toUpperCase()}</div>
                                    <span>${user.name || 'Unknown'}</span>
                                </div>
                            </td>
                            <td>${user.email || 'N/A'}</td>
                            <td><span class="badge ${planClass}">${user.plan || 'starter'}</span></td>
                            <td>$${user.credits || 0}</td>
                            <td>${user.has_paid ? '✓' : '✗'}</td>
                            <td>${user.created_at ? user.created_at.split('T')[0] : 'N/A'}</td>
                            <td><button class="btn btn-primary" onclick="openEdit('${user.id}')">Edit</button></td>
                        </tr>
                    `;
                }
                
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }
        
        // Load Agents
        async function loadAgents() {
            const container = document.getElementById('agentsContainer');
            container.innerHTML = '<div class="loading">Loading agents...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/admin/agents`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (!response.ok) throw new Error('Failed to load agents');
                
                const data = await response.json();
                const agents = data.agents || [];
                
                if (agents.length === 0) {
                    container.innerHTML = '<div class="loading">No agents found</div>';
                    return;
                }
                
                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>User</th>
                                <th>Model</th>
                                <th>Status</th>
                                <th>Messages</th>
                                <th>Created</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                for (const agent of agents) {
                    const statusClass = agent.status === 'running' ? 'badge-running' : 'badge-stopped';
                    html += `
                        <tr>
                            <td>${agent.name || 'Unknown'}</td>
                            <td>${agent.user_name || agent.user_id}</td>
                            <td>${agent.model || 'N/A'}</td>
                            <td><span class="badge ${statusClass}">${agent.status || 'stopped'}</span></td>
                            <td>${agent.message_count || 0}</td>
                            <td>${agent.created_at ? agent.created_at.split('T')[0] : 'N/A'}</td>
                        </tr>
                    `;
                }
                
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }
        
        // Edit User
        function openEdit(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;
            
            document.getElementById('editUserId').value = user.id;
            document.getElementById('editName').value = user.name || '';
            document.getElementById('editEmail').value = user.email || '';
            document.getElementById('editPlan').value = user.plan || 'starter';
            document.getElementById('editCredits').value = user.credits || 0;
            document.getElementById('editHasPaid').checked = user.has_paid === 1 || user.has_paid === true;
            
            document.getElementById('editModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }
        
        async function saveUser() {
            const userId = document.getElementById('editUserId').value;
            
            const updates = {
                name: document.getElementById('editName').value,
                plan: document.getElementById('editPlan').value,
                credits: parseFloat(document.getElementById('editCredits').value),
                has_paid: document.getElementById('editHasPaid').checked
            };
            
            try {
                const response = await fetch(`${API_URL}/api/admin/users/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updates)
                });
                
                if (response.ok) {
                    closeModal();
                    loadUsers();
                    alert('User updated!');
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to update');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
        
        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }
        
        // Close modal on backdrop
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') closeModal();
        });
        
        // Load dashboard on page load
        loadDashboard();
    </script>
</body>
</html>
