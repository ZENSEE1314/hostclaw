<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - HostClaw.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --secondary: #06b6d4;
            --dark: #0f0f23;
            --darker: #0a0a1a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--darker); color: var(--text); min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; padding: 2rem; }
        
        .header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.5rem 1rem; color: var(--text); text-decoration: none; }
        h1 { font-size: 1.75rem; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .card-title { font-weight: 600; font-size: 1.125rem; margin-bottom: 1rem; }
        
        .credits-display { text-align: center; padding: 2rem; }
        .credits-amount { font-size: 3rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .packages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .package { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.2s; }
        .package:hover { border-color: var(--primary); }
        .package.popular { border-color: var(--primary); }
        .package-amount { font-size: 2rem; font-weight: 700; }
        .package-price { color: var(--text-muted); margin-bottom: 1rem; }
        
        .btn { width: 100%; padding: 0.875rem; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        
        .setup-fee { background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(6,182,212,0.15)); border: 2px solid var(--primary); border-radius: 16px; padding: 2rem; text-align: center; margin-bottom: 2rem; }
        .setup-price { font-size: 2.5rem; font-weight: 800; color: var(--primary-light); }
        
        .payment-wall { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .payment-card { background: var(--dark); border: 1px solid var(--border); border-radius: 24px; padding: 3rem; text-align: center; max-width: 450px; }
    </style>
</head>
<body>
    <div class="payment-wall" id="paymentWall" style="display: none;">
        <div class="payment-card">
            <div style="font-size: 4rem;">💳</div>
            <div style="font-size: 1.5rem; font-weight: 700; margin: 1rem 0;">One-Time Setup Fee</div>
            <div style="font-size: 2.5rem; font-weight: 800; color: var(--primary-light);">$500</div>
            <p style="margin: 1.5rem 0; color: var(--text-muted);">Pay once, unlock all features forever!</p>
            <button class="btn btn-primary" onclick="paySetupFee()">Pay $500 &rarr;</button>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <a href="/dashboard.html" class="back-btn">← Back</a>
            <h1>Billing</h1>
        </div>

        <div class="setup-fee">
            <div class="setup-price">$500</div>
            <p>One-time setup fee to unlock all features</p>
            <button class="btn btn-primary" style="margin-top: 1rem; max-width: 200px;" onclick="paySetupFee()">Pay Now</button>
        </div>

        <div class="card">
            <div class="card-title">Your Credits</div>
            <div class="credits-display">
                <div class="credits-amount" id="creditsDisplay">$0.00</div>
                <p style="color: var(--text-muted); margin-top: 0.5rem;">Available for AI usage</p>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Add Credits</div>
            <div class="packages">
                <div class="package" onclick="addCredits(5)">
                    <div class="package-amount">$5</div>
                    <div class="package-price">$5.00</div>
                    <button class="btn btn-primary">Buy</button>
                </div>
                <div class="package popular" onclick="addCredits(20)">
                    <div class="package-amount">$20</div>
                    <div class="package-price">$20.00</div>
                    <button class="btn btn-primary">Buy</button>
                </div>
                <div class="package" onclick="addCredits(50)">
                    <div class="package-amount">$50</div>
                    <div class="package-price">$50.00</div>
                    <button class="btn btn-primary">Buy</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://hostclaw-api.onrender.com';
        const token = localStorage.getItem('token');
        
        if (!token) window.location.href = '/login.html';

        // Check for payment success
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('paid') === 'success') {
            alert('Payment successful! Now let\'s set up your AI provider.');
            window.location.href = '/settings.html?setup=1';
        }

        async function loadCredits() {
            try {
                const res = await fetch(`${API_URL}/api/auth/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    const user = data.user || data;
                    document.getElementById('creditsDisplay').textContent = '$' + parseFloat(user.credits || 0).toFixed(2);
                    
                    // Show payment wall if not paid
                    if (!user.has_paid && user.plan === 'starter') {
                        document.getElementById('paymentWall').style.display = 'flex';
                    }
                }
            } catch(e) { console.error(e); }
        }

        async function paySetupFee() {
            try {
                const res = await fetch(`${API_URL}/api/billing/setup-fee`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await res.json();
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert(data.error || 'Payment error');
                }
            } catch(e) {
                alert('Payment unavailable');
            }
        }

        async function addCredits(amount) {
            try {
                const res = await fetch(`${API_URL}/api/billing/credits`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ amount })
                });
                const data = await res.json();
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert(data.error || 'Payment error');
                }
            } catch(e) {
                alert('Payment unavailable');
            }
        }

        loadCredits();
    </script>
</body>
</html>
