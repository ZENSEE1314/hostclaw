<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - HostClaw.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #06b6d4;
            --accent: #f59e0b;
            --dark: #0f0f23;
            --darker: #0a0a1a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--darker);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
        }

        /* Credits Card */
        .credits-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(6, 182, 212, 0.15) 100%);
            border: 1px solid var(--primary);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .credits-amount {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .credits-label {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .btn-add-credits {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add-credits:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        /* Credit Packages */
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .package-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .package-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .package-card.popular {
            border-color: var(--primary);
            position: relative;
        }

        .popular-badge {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
            font-weight: 600;
        }

        .package-amount {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .package-price {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .package-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .package-card:hover .package-btn {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* Usage Info */
        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .info-title {
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            font-weight: 500;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .packages-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='/dashboard.html'">←</button>
            <h1>Billing</h1>
        </div>

        <div class="credits-card">
            <div class="credits-amount" id="creditsDisplay">$0.00</div>
            <div class="credits-label">Available AI Credits</div>
            <button class="btn-add-credits" onclick="addCredits(10)">+ Add $10 Credits</button>
        </div>

        <div class="section-title">Credit Packages</div>
        <div class="packages-grid">
            <div class="package-card" onclick="addCredits(5)">
                <div class="package-amount">$5</div>
                <div class="package-price">$5.00</div>
                <button class="package-btn">Buy</button>
            </div>
            <div class="package-card popular" onclick="addCredits(20)">
                <div class="popular-badge">Best Value</div>
                <div class="package-amount">$20</div>
                <div class="package-price">$20.00</div>
                <button class="package-btn">Buy</button>
            </div>
            <div class="package-card" onclick="addCredits(50)">
                <div class="package-amount">$50</div>
                <div class="package-price">$50.00</div>
                <button class="package-btn">Buy</button>
            </div>
        </div>

        <div class="info-card">
            <div class="info-title">💳 How Credits Work</div>
            <div class="info-row">
                <span class="info-label">OpenAI GPT-4o</span>
                <span class="info-value">~$0.03 / 1K tokens</span>
            </div>
            <div class="info-row">
                <span class="info-label">Anthropic Claude</span>
                <span class="info-value">~$0.03 / 1K tokens</span>
            </div>
            <div class="info-row">
                <span class="info-label">Kimi K2.5</span>
                <span class="info-value">~$0.015 / 1K tokens</span>
            </div>
            <div class="info-row">
                <span class="info-label">DeepSeek Chat</span>
                <span class="info-value">~$0.002 / 1K tokens</span>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://hostclaw-api.onrender.com';
        const token = localStorage.getItem('token');
        
        if (!token) {
            window.location.href = '/login.html';
        }

        async function loadCredits() {
            try {
                const response = await fetch(`${API_URL}/api/auth/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    const user = data.user || data;
                    document.getElementById('creditsDisplay').textContent = 
                        '$' + parseFloat(user.credits || 0).toFixed(2);
                }
            } catch (error) {
                console.error('Failed to load credits:', error);
            }
        }

        async function addCredits(amount) {
            try {
                const response = await fetch(`${API_URL}/api/billing/credits`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ amount })
                });

                const data = await response.json();

                if (response.ok && data.url) {
                    window.location.href = data.url;
                } else {
                    alert(data.error || 'Failed to initiate payment');
                }
            } catch (error) {
                alert('Network error. Please try again.');
            }
        }

        // Check for success/cancel from Stripe
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('credits') === 'success') {
            alert('Credits added successfully!');
            loadCredits();
            window.history.replaceState({}, '', '/billing.html');
        } else if (urlParams.get('credits') === 'cancelled') {
            alert('Payment cancelled.');
            window.history.replaceState({}, '', '/billing.html');
        }

        loadCredits();
    </script>
</body>
</html>
