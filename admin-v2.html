<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - HostClaw</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #2d2d3d;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 24px; }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-primary {
            background: #6366f1;
            color: white;
        }
        .btn-primary:hover { background: #4f46e5; }
        .btn-secondary {
            background: transparent;
            border: 1px solid #3d3d4d;
            color: #94a3b8;
        }
        .btn-secondary:hover {
            border-color: #6366f1;
            color: #fff;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-success:hover { background: #059669; }
        
        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #12121f;
            border-radius: 12px;
            overflow: hidden;
        }
        th {
            background: #1e1e2e;
            padding: 16px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 600;
            border-bottom: 1px solid #2d2d3d;
        }
        td {
            padding: 16px;
            border-bottom: 1px solid #2d2d3d;
            font-size: 14px;
        }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        /* Badges */
        .badge {
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-starter { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .badge-pro { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .badge-enterprise { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
        
        /* Status */
        .status-yes { color: #10b981; }
        .status-no { color: #64748b; }
        
        /* User cell */
        .user-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #12121f;
            border: 1px solid #2d2d3d;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            padding: 24px 24px 0;
        }
        .modal-header h2 {
            font-size: 20px;
            margin: 0;
        }
        .modal-body {
            padding: 24px;
        }
        .modal-footer {
            padding: 0 24px 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        /* Form */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #94a3b8;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: #1e1e2e;
            border: 1px solid #2d2d3d;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }
        .form-input:focus {
            outline: none;
            border-color: #6366f1;
        }
        .form-select {
            width: 100%;
            padding: 12px 16px;
            background: #1e1e2e;
            border: 1px solid #2d2d3d;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }
        .form-select:focus {
            outline: none;
            border-color: #6366f1;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }
        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #6366f1;
            cursor: pointer;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }
        .error {
            text-align: center;
            padding: 60px;
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>👥 User Management</h1>
            <div>
                <button class="btn btn-secondary" onclick="logout()">Logout</button>
                <button class="btn btn-primary" onclick="loadUsers()">Refresh</button>
            </div>
        </div>
        
        <!-- Users Table -->
        <div id="usersContainer">
            <div class="loading">Loading users...</div>
        </div>
    </div>
    
    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Edit User</h2>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editUserId">
                
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="editName" class="form-input">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email (read-only)</label>
                    <input type="text" id="editEmail" class="form-input" readonly style="background: #0a0a1a; cursor: not-allowed;">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Plan</label>
                    <select id="editPlan" class="form-select">
                        <option value="starter">Starter</option>
                        <option value="pro">Pro</option>
                        <option value="enterprise">Enterprise</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Credits ($)</label>
                    <input type="number" id="editCredits" class="form-input" step="0.01">
                </div>
                
                <div class="form-group">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="editHasPaid">
                        <label for="editHasPaid">Mark as Paid</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-success" onclick="saveUser()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://hostclaw-api.onrender.com';
        let allUsers = [];
        
        // Check if logged in
        const token = localStorage.getItem('adminToken') || localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login.html';
        }
        
        async function loadUsers() {
            const container = document.getElementById('usersContainer');
            container.innerHTML = '<div class="loading">Loading users...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/admin/users`, {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                
                if (response.status === 401) {
                    localStorage.removeItem('adminToken');
                    localStorage.removeItem('token');
                    window.location.href = '/login.html';
                    return;
                }
                
                if (!response.ok) {
                    container.innerHTML = `<div class="error">Error loading users: ${response.status}</div>`;
                    return;
                }
                
                const data = await response.json();
                allUsers = data.users || [];
                
                if (allUsers.length === 0) {
                    container.innerHTML = '<div class="loading">No users found</div>';
                    return;
                }
                
                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Email</th>
                                <th>Plan</th>
                                <th>Credits</th>
                                <th>Paid</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                for (const user of allUsers) {
                    const planClass = 'badge-' + (user.plan || 'starter');
                    html += `
                        <tr>
                            <td>
                                <div class="user-cell">
                                    <div class="user-avatar">${(user.name || '?').charAt(0).toUpperCase()}</div>
                                    <span>${user.name || 'Unknown'}</span>
                                </div>
                            </td>
                            <td>${user.email || 'N/A'}</td>
                            <td><span class="badge ${planClass}">${user.plan || 'starter'}</span></td>
                            <td>$${user.credits || 0}</td>
                            <td class="${user.has_paid ? 'status-yes' : 'status-no'}">${user.has_paid ? '✓ Yes' : '✗ No'}</td>
                            <td>${user.created_at ? user.created_at.split('T')[0] : 'N/A'}</td>
                            <td><button class="btn btn-primary" onclick="openEdit('${user.id}')">Edit</button></td>
                        </tr>
                    `;
                }
                
                html += '</tbody></table>';
                container.innerHTML = html;
                
            } catch (err) {
                container.innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }
        
        function openEdit(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;
            
            document.getElementById('editUserId').value = user.id;
            document.getElementById('editName').value = user.name || '';
            document.getElementById('editEmail').value = user.email || '';
            document.getElementById('editPlan').value = user.plan || 'starter';
            document.getElementById('editCredits').value = user.credits || 0;
            document.getElementById('editHasPaid').checked = user.has_paid === 1 || user.has_paid === true;
            
            document.getElementById('editModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }
        
        async function saveUser() {
            const userId = document.getElementById('editUserId').value;
            
            const updates = {
                name: document.getElementById('editName').value,
                plan: document.getElementById('editPlan').value,
                credits: parseFloat(document.getElementById('editCredits').value),
                has_paid: document.getElementById('editHasPaid').checked
            };
            
            try {
                const response = await fetch(`${API_URL}/api/admin/users/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updates)
                });
                
                if (response.ok) {
                    closeModal();
                    loadUsers();
                    alert('User updated successfully!');
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to update user');
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            }
        }
        
        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }
        
        // Close modal on backdrop click
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') closeModal();
        });
        
        // Load on page load
        loadUsers();
    </script>
</body>
</html>
