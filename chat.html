<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - HostClaw.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/shared.css" rel="stylesheet">
    <style>
        .chat-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: calc(100vh - 4rem);
            gap: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--bg-card);
        }

        /* Conversation List */
        .conv-list {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
        }

        .conv-search {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .conv-search input {
            width: 100%;
            padding: 0.6rem 0.875rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.8125rem;
            font-family: inherit;
        }

        .conv-search input:focus { outline: none; border-color: var(--accent); }
        .conv-search input::placeholder { color: var(--text-muted); }

        .conv-items {
            flex: 1;
            overflow-y: auto;
        }

        .conv-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.15s;
        }

        .conv-item:hover { background: rgba(255,255,255,0.03); }
        .conv-item.active { background: var(--accent-bg); }

        .conv-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .conv-icon.whatsapp { background: rgba(37,211,102,0.1); color: #25d366; }
        .conv-icon.telegram { background: rgba(0,136,204,0.1); color: #0088cc; }
        .conv-icon.web { background: var(--accent-bg); color: var(--accent-light); }

        .conv-info { flex: 1; min-width: 0; }

        .conv-name {
            font-size: 0.8125rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-preview {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-time {
            font-size: 0.625rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* Chat Panel */
        .chat-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .chat-header-name { font-size: 0.9375rem; font-weight: 600; }
        .chat-header-platform { font-size: 0.75rem; color: var(--text-muted); }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .msg {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .msg.user {
            align-self: flex-end;
            background: rgba(99,102,241,0.15);
            border-bottom-right-radius: 4px;
        }

        .msg.assistant {
            align-self: flex-start;
            background: var(--bg-elevated);
            border-bottom-left-radius: 4px;
        }

        .msg-time {
            font-size: 0.625rem;
            color: var(--text-muted);
            margin-top: 0.375rem;
        }

        .msg.user .msg-time { text-align: right; }

        .chat-input-area {
            display: flex;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .chat-input-area input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
        }

        .chat-input-area input:focus { outline: none; border-color: var(--accent); }
        .chat-input-area input::placeholder { color: var(--text-muted); }

        /* Empty States */
        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .chat-empty svg { opacity: 0.3; margin-bottom: 1rem; }
        .chat-empty p { font-size: 0.9rem; }

        @media (max-width: 768px) {
            .chat-layout { grid-template-columns: 1fr; height: calc(100vh - 6rem); }
            .conv-list { display: none; }
            .conv-list.show { display: flex; position: fixed; inset: 0; z-index: 100; }
        }
    </style>
</head>
<body>
<div class="app-layout">
    <div class="main-content" style="padding-bottom:0.5rem">
        <div class="page-header">
            <div>
                <h1>Conversations</h1>
                <p class="page-header-sub">View and manage bot conversations</p>
            </div>
            <div style="display:flex;gap:0.5rem">
                <button class="btn btn-outline btn-sm" onclick="loadConversations()" title="Refresh">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    Refresh
                </button>
                <button class="btn btn-danger btn-sm" onclick="clearAllHistory()">Clear History</button>
            </div>
        </div>

        <div class="chat-layout">
            <!-- Conversation List -->
            <div class="conv-list" id="convList">
                <div class="conv-search">
                    <input type="text" placeholder="Search conversations..." id="convSearch" oninput="filterConversations()">
                </div>
                <div class="conv-items" id="convItems">
                    <div class="chat-empty" style="padding:2rem">
                        <p>Loading...</p>
                    </div>
                </div>
            </div>

            <!-- Chat Panel -->
            <div class="chat-panel">
                <div class="chat-header" id="chatHeader" style="display:none">
                    <div class="conv-icon web" id="chatIcon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </div>
                    <div>
                        <div class="chat-header-name" id="chatName">Conversation</div>
                        <div class="chat-header-platform" id="chatPlatform">Web Chat</div>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="chat-empty">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        <p>Select a conversation to view messages</p>
                    </div>
                </div>

                <div class="chat-input-area" id="chatInputArea" style="display:none">
                    <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
                    <button class="btn btn-primary" onclick="sendMessage()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/shared.js"></script>
<script src="/js/sidebar.js"></script>
<script>
    requireAuth();

    let conversations = {};
    let allMessages = [];
    let activeSession = null;

    loadConversations();

    async function loadConversations() {
        try {
            const data = await api('/api/chat/history');
            allMessages = data.messages || data || [];

            // Group by session_id
            conversations = {};
            allMessages.forEach(msg => {
                const sid = msg.session_id || 'default';
                if (!conversations[sid]) {
                    conversations[sid] = { messages: [], platform: 'web', lastTime: null };
                }
                conversations[sid].messages.push(msg);
                const t = new Date(msg.created_at);
                if (!conversations[sid].lastTime || t > conversations[sid].lastTime) {
                    conversations[sid].lastTime = t;
                }
                // Detect platform from session_id
                if (sid.startsWith('telegram_')) conversations[sid].platform = 'telegram';
                else if (sid.startsWith('whatsapp_')) conversations[sid].platform = 'whatsapp';
            });

            renderConversationList();
        } catch (e) {
            document.getElementById('convItems').innerHTML = '<div class="chat-empty" style="padding:2rem"><p>No conversations yet</p></div>';
        }
    }

    function renderConversationList() {
        const container = document.getElementById('convItems');
        const sorted = Object.entries(conversations).sort((a, b) => (b[1].lastTime || 0) - (a[1].lastTime || 0));

        if (sorted.length === 0) {
            container.innerHTML = '<div class="chat-empty" style="padding:2rem"><p>No conversations yet</p></div>';
            return;
        }

        container.innerHTML = sorted.map(([sid, conv]) => {
            const lastMsg = conv.messages[conv.messages.length - 1];
            const preview = escapeHtml((lastMsg?.content || '').substring(0, 50));
            const name = formatSessionName(sid, conv.platform);
            const iconClass = conv.platform;
            const icon = conv.platform === 'whatsapp'
                ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.832-1.438A9.955 9.955 0 0 0 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/></svg>'
                : conv.platform === 'telegram'
                ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>'
                : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

            return `
                <div class="conv-item ${activeSession === sid ? 'active' : ''}" onclick="selectConversation('${escapeHtml(sid)}')">
                    <div class="conv-icon ${iconClass}">${icon}</div>
                    <div class="conv-info">
                        <div class="conv-name">${escapeHtml(name)}</div>
                        <div class="conv-preview">${preview}</div>
                    </div>
                    <div class="conv-time">${conv.lastTime ? timeAgo(conv.lastTime) : ''}</div>
                </div>
            `;
        }).join('');
    }

    function selectConversation(sid) {
        activeSession = sid;
        const conv = conversations[sid];
        if (!conv) return;

        // Update list active state
        document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
        event?.target?.closest?.('.conv-item')?.classList.add('active');

        // Show header
        document.getElementById('chatHeader').style.display = 'flex';
        document.getElementById('chatInputArea').style.display = 'flex';
        document.getElementById('chatName').textContent = formatSessionName(sid, conv.platform);

        const platformLabels = { whatsapp: 'WhatsApp', telegram: 'Telegram', web: 'Web Chat' };
        document.getElementById('chatPlatform').textContent = platformLabels[conv.platform] || 'Chat';

        const iconEl = document.getElementById('chatIcon');
        iconEl.className = `conv-icon ${conv.platform}`;

        // Render messages
        const container = document.getElementById('chatMessages');
        container.innerHTML = conv.messages.map(msg => `
            <div class="msg ${msg.role}">
                <div>${escapeHtml(msg.content)}</div>
                <div class="msg-time">${msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}</div>
            </div>
        `).join('');

        container.scrollTop = container.scrollHeight;
        renderConversationList();
    }

    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        const container = document.getElementById('chatMessages');

        // Add user message
        container.innerHTML += `<div class="msg user"><div>${escapeHtml(text)}</div><div class="msg-time">now</div></div>`;
        container.scrollTop = container.scrollHeight;

        try {
            const data = await api('/api/chat/message', {
                method: 'POST',
                body: JSON.stringify({ message: text, session_id: activeSession || 'default' })
            });
            const reply = data.content || data.message || data.response || 'No response';
            container.innerHTML += `<div class="msg assistant"><div>${escapeHtml(reply)}</div><div class="msg-time">now</div></div>`;
            container.scrollTop = container.scrollHeight;
        } catch (e) {
            container.innerHTML += `<div class="msg assistant"><div style="color:var(--danger)">${escapeHtml(e.message)}</div></div>`;
            container.scrollTop = container.scrollHeight;
        }
    }

    async function clearAllHistory() {
        if (!confirm('Clear all conversation history? This cannot be undone.')) return;
        try {
            await api('/api/chat/history', { method: 'DELETE' });
            conversations = {};
            allMessages = [];
            activeSession = null;
            document.getElementById('convItems').innerHTML = '<div class="chat-empty" style="padding:2rem"><p>No conversations yet</p></div>';
            document.getElementById('chatMessages').innerHTML = '<div class="chat-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>No conversations</p></div>';
            document.getElementById('chatHeader').style.display = 'none';
            document.getElementById('chatInputArea').style.display = 'none';
            showToast('History cleared', 'success');
        } catch (e) { showToast(e.message, 'error'); }
    }

    function filterConversations() {
        const q = document.getElementById('convSearch').value.toLowerCase();
        document.querySelectorAll('.conv-item').forEach(el => {
            const text = el.textContent.toLowerCase();
            el.style.display = text.includes(q) ? '' : 'none';
        });
    }

    function formatSessionName(sid, platform) {
        if (sid === 'default') return 'Web Chat';
        const prefix = platform === 'telegram' ? 'Telegram' : platform === 'whatsapp' ? 'WhatsApp' : '';
        const id = sid.replace(/^(telegram_|whatsapp_|web_)/, '');
        if (id.length > 15) return `${prefix} ${id.substring(0, 12)}...`;
        return `${prefix} ${id}`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
</script>
</body>
</html>
